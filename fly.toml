# fly.toml app configuration file generated for calendar-dynamics on 2026-10-16T21:08:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'calendar-dynamics'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  BASE_URL = 'https://calendar-dynamics.fly.dev'
  DB_PATH = '/data/app.db'
  EMAIL_FROM = 'Calendar Dynamics <no-reply@calendardynamics.com>'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
