# fly.toml app configuration file generated for calendar-dynamics on 2026-10-16T21:54:49Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'calendar-dynamics'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  BASE_URL = 'https://calendar-dynamics.fly.dev'
  DB_PATH = '/data/app.db'
  EMAIL_FROM = 'Calendar Dynamics <no-reply@calendardynamics.com>'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '15s', interval = '30s', method = 'GET', path = '/healthz', timeout = '5s' }]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
